<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — NoiseSensor</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card" aria-labelledby="login-title">

            <header class="auth-header">

                <p class="auth-brand">
                    NoiseSensor
                </p>

                <h1 id="login-title">
                    Entrar
                </h1>

                <p>
                    Acesse seu painel de monitoramento de ruído.
                </p>

            </header>


            <div id="auth-message" class="auth-message" hidden></div>


            <form id="login-form" class="auth-form">

                <div class="form-field">

                    <label for="email">
                        E-mail
                    </label>

                    <input id="email" name="email" type="email" autocomplete="email" required>

                </div>


                <div class="form-field">

                    <label for="password">
                        Senha
                    </label>

                    <input id="password" name="password" type="password" autocomplete="current-password" required>

                </div>


                <button id="login-button" class="auth-button" type="submit">
                    Entrar
                </button>

            </form>


            <p class="auth-footer">

                Ainda não possui uma conta?

                <a href="/cadastro">
                    Criar conta
                </a>

            </p>

        </section>

    </main>


    <script src="{{ url_for('static', path='js/login.js') }}"></script>

</body>

</html>
